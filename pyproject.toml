[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dupradar"
version = "0.1.0"
description = "Multi-Repository Code Duplication Resolver"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dupradar = "dupradar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dupradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
